[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# La página de regalo abre la billetera: nunca dentro de un marco ajeno.
[[headers]]
  for = "/regalo.html"
  [headers.values]
    X-Frame-Options = "DENY"

[[headers]]
  for = "/regalo"
  [headers.values]
    X-Frame-Options = "DENY"
